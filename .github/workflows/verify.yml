name: Local payment verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-payments:
    runs-on: ubuntu-24.04
    # The complete local suite takes about 29 minutes; leave room for slower runners.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # The filmed upgrade test builds both historical contract revisions.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies without install scripts
        run: npm ci --ignore-scripts
      - name: Reject high and critical dependency advisories
        run: npm audit --audit-level=high
      - name: Install and audit the local MCP adapter
        run: |
          npm ci --prefix mcp --ignore-scripts
          npm audit --prefix mcp --audit-level=high
      - name: Verify the isolated testnet tooling offline
        run: |
          npm ci --prefix testnet --ignore-scripts
          npm --prefix testnet test
      - name: Verify the recorded public demo
        run: npm run test:replay
      - name: Install the contract toolchain
        run: |
          rustup toolchain install 1.99.1 --profile minimal --target wasm32-unknown-unknown
          rustup override set 1.99.1
      - name: Install pinned local test chain
        run: |
          mkdir -p work/sandbox-bin
          curl --fail --silent --show-error --location --retry 3 \
            https://s3-us-west-1.amazonaws.com/build.nearprotocol.com/nearcore/Linux-x86_64/2.14.0/near-sandbox.tar.gz \
            --output work/near-sandbox.tar.gz
          echo 'a0ba004218b218bd74351795e7ce2eda4a2b6af5cd3e252bd5e8bfe3c8f2e691  work/near-sandbox.tar.gz' | sha256sum --check
          tar -xzf work/near-sandbox.tar.gz --strip-components=1 -C work/sandbox-bin
          chmod +x work/sandbox-bin/near-sandbox
      - name: Race two signed bills, crash the worker and retry
        # The archived revisions build outside the checkout's rustup override directory.
        env:
          RUSTUP_TOOLCHAIN: '1.99.1'
        run: |
          mkdir -p "$RUNNER_TEMP/weekly-demo"
          TMPDIR="$RUNNER_TEMP/weekly-demo" npm run test:upgrade:weekly
      - name: Save the weekly payment result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: weekly-payment-result
          # Only the public balance report. The sibling vault directory contains local keys.
          path: ${{ runner.temp }}/weekly-demo/countersign-upgrade-retest-*/result.json
          if-no-files-found: error
          retention-days: 14

      - name: Test contract authorization rules
        run: cargo test --locked --manifest-path contract/Cargo.toml
      - name: Verify local payments and crash recovery
        # Fixture proposals and quotes only. No API keys or external payment accounts.
        run: npm run demo:verify
      - name: Verify MCP requests, crash recovery and duplicate weekly bills
        run: npm --prefix mcp test
      - name: Save verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: local-verification
          # Never upload work/ itself: it can contain disposable private keys.
          path: |
            work/demo-output.txt
            work/demo.cast
          if-no-files-found: ignore
          retention-days: 14

  publish-recorded-demo:
    needs: local-payments
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Build only the recorded demo and public receipts
        run: npm run build:replay
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: work/replay-site
      - name: Publish verified recorded demo
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
